  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #3d87c7; /* Blue Background */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh; /* Ensure full viewport height */
    }
    /* Pseudo-element for background image */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("{{ url_for('static', filename='images/Calendar.png') }}"); /* Background image URL */
      background-size: cover;
      background-position: center;
      filter: blur(10px); /* Apply blur effect */
      z-index: -1; /* Place behind other content */
    }

    /* Blue tint overlay */
    body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background-color: rgba(69, 190, 254, 0.5); /* Semi-transparent blue color */
      z-index: -1; /* Place behind other content */
    }

    .menu-button {
      position: fixed;
      top: 20px;
      left: 20px;
      cursor: pointer;
      color: #3D4756; /* Deep Blue Color */
      font-size: 24px;
      z-index: 2; /* Ensure the button is above the taskbar */
    }

    .taskbar {
      position: fixed;
      top: 0;
      left: -200px; /* Initial position outside the viewport */
      width: 200px;
      height: 100%;
      background-color: #F6F4F4; /* White Background */
      box-shadow: 2px 0px 5px rgba(0, 0, 0, 0.1);
      transition: left 0.3s ease-in-out;
      z-index: 1; /* Ensure the taskbar is behind the button */
      overflow: hidden; /* Hide potential scrollbar */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .lines {
      display: block;
      margin: 8px 0;
    }

    .line {
      height: 3px;
      width: 30px;
      background-color: #3D4756; /* Deep Blue Color */
      margin: 5px 0;
    }

    .return-home {
      position: fixed;
      top: 20px;
      right: 20px;
      cursor: pointer;
      color: #000000; /* Light Cyan Background Color */
      font-size: 18px;
      z-index: 2; /* Ensure the button is above the taskbar */
    }

    .login-container {
      text-align: center;
      max-width: 60%;
      padding: 5%;
      background-color: #F6F4F4; /* White Background */
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      margin-bottom: 20%;
      margin-top: 30%;
    }

    h1 {
      color: #333333; /* Dark Text Color */
    }

    .logo {
      width: 100%; /* Full width for responsiveness */
      max-width: 300px; /* Adjust the max-width as needed */
      margin-bottom: 20px; /* Increased margin to create more space */
    }

    .input-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #dddddd; /* Light Gray Outline */
      border-radius: 5px;
      box-sizing: border-box;
    }

    .button {
      background-color: #A1ACBD; /* Dark Cyan Button Color */
      color: #F6F4F4; /* White Text Color */
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease-in-out;
      margin-top: 20px;
      display: block; /* Buttons on top of each other */
      width: 100%; /* Full width */
    }

    .button:hover {
      background-color: #3D4756; /* Slightly Darker Cyan on Hover */
    }

    .buttonTxt{
      text-decoration: none;
      color: #F6F4F4; /* White Text Color */
    }

    .banner {
      background-color: #000000; /* Black Background for the Banner */
      color: #F6F4F4; /* White Text Color */
      padding: 5%; /* Adjusted to be a percentage of the container width */
      text-align: center;
      width: 100%;
    }

    .signup-link {
      margin-top: 10px;
      color: #333333;
    }

    .signup-link a {
      color: #007BFF; /* Blue Link Color */
      text-decoration: none;
      font-weight: bold;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .goals-container {
      text-align: left;
      min-width: 60%;
      max-width: 80%;
      height: 90%;
      padding: 2%;

      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      margin-top: 30px;
    }
  </style>

    <!-- Add a form to input event details -->
    <form id="eventForm">
      <input type="text" id="eventName" placeholder="Event Name" required>
      <input type="datetime-local" id="eventDateTime" required>
      <button type="submit">Add Event</button>
    </form>

  <script>
    function toggleTaskbar() {
      const taskbar = document.querySelector('.taskbar');
      const newLeft = taskbar.style.left === '0px' ? '-200px' : '0px';
      taskbar.style.left = newLeft;
    }
  </script>
  <script src="script.js"></script>

  <script>
    // Initialize the Google Calendar API client
    gapi.load('client:auth2', initClient);
  
    // Initialize the API client
    function initClient() {
      gapi.client.init({
        apiKey: 'AIzaSyAUpe_q39qIKE7ISSY-yuKMAEP6THHAKyk',
        clientId: '640920800264-inll4seb5ib69hliflc9h9658r37ch4n.apps.googleusercontent.com',
        discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"],
        scope: 'https://www.googleapis.com/auth/calendar.events'
      }).then(function () {
        console.log('Google Calendar API initialized');
      });
    }
  
    // Function to add an event to Google Calendar
    function addEvent(event) {
      gapi.client.calendar.events.insert({
        'calendarId': 'primary',
        'resource': event
      }).then(function(response) {
        console.log('Event added: ' + response.result.htmlLink);
      }, function(err) {
        console.error('Error adding event: ' + err);
      });
    }
  
    // Handle form submission
    document.getElementById('eventForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const eventName = document.getElementById('eventName').value;
      const eventDateTime = document.getElementById('eventDateTime').value;
      
      // Create event object
      const eventObject = {
        'summary': eventName,
        'start': {
          'dateTime': eventDateTime,
          'timeZone': 'Your_Time_Zone'
        },
        'end': {
          'dateTime': eventDateTime,
          'timeZone': 'Your_Time_Zone'
        }
      };
  
      // Add event to Google Calendar
      addEvent(eventObject);
    });
  </script>
