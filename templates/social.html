    /* Pseudo-element for background image */
    body::before {
      content: '';

      left: 0;
      width: 100%;
      height: 100%;

      top: 0;
      left: 0;

      height: 200%;

    .container {

    .input-field {

      border: none;

<div class="container">
  <h1>Enter Bio (Available to the Public!)</h1>

  <!-- Text Input Field -->
  <textarea id="text-input" class="input-field" placeholder="Type your text here..." oninput="autoExpand(this)" onkeydown="handleKeyPress(event)"></textarea>

  <!-- Submit Button -->
  <button class="submit-button" onclick="submitText()">Submit</button>

  <!-- Display Submitted Answers -->
  <div id="submitted-answers" class="submitted-answer"></div>
</div>

<script>
  // Function to open menu
  function openMenu() {
    document.getElementById('menu').style.transform = 'translateX(0)';
  }

  // Function to close menu
  function closeMenu() {
    document.getElementById('menu').style.transform = 'translateX(-100%)';
  }

  // Function to submit text
  function submitText() {
    const textInput = document.getElementById('text-input');
    const submittedAnswers = document.getElementById('submitted-answers');
    const text = textInput.value; // No need to trim here
    if (text !== '') {
      const newAnswer = document.createElement('div');
      newAnswer.textContent = text;
      submittedAnswers.appendChild(newAnswer);
      textInput.value = ''; // Clear text box after submission
      autoExpand(textInput); // Adjust textarea height after submission
    }
  }

  // Function to auto-expand textarea
  function autoExpand(textarea) {
    // Reset height to auto to shrink back if needed
    textarea.style.height = 'auto';
    // Set the height of the textarea based on its scroll height and scroll padding
    textarea.style.height = textarea.scrollHeight + 'px';
  }

  // Function to handle key press event (to preserve new line characters)
  function handleKeyPress(event) {
    if (event.key === 'Enter') {
      // Append new line character instead of submitting the form
      event.preventDefault();
      const textInput = event.target;
      const startPos = textInput.selectionStart;
      const endPos = textInput.selectionEnd;
      const textBeforeCursor = textInput.value.substring(0, startPos);
      const textAfterCursor = textInput.value.substring(endPos, textInput.value.length);
      textInput.value = textBeforeCursor + '\n' + textAfterCursor;
      // Move cursor to the new line
      textInput.selectionStart = startPos + 1;
      textInput.selectionEnd = startPos + 1;
      autoExpand(textInput); // Adjust textarea height after pressing Enter
    }
  }
</script>
